# Sitio NUEVO — dominios TLD por país (landing estática)
# NO modifica intercertlatam.com ni portal.intercertlatam.com
# Instalar como archivo aparte en sites-available

server {
    listen 80;
    listen [::]:80;

    server_name
        intercert.co
        www.intercert.co
        intercert.mx
        www.intercert.mx
        intercert.ec
        www.intercert.ec
        intercert.pa
        www.intercert.pa
        intercert.com.pe
        www.intercert.com.pe
        intercert.cr
        www.intercert.cr
        intercert.es
        www.intercert.es;

    root /var/www/intercert-landing;
    index index.html;

    access_log /var/log/nginx/intercert-dominios.access.log;
    error_log  /var/log/nginx/intercert-dominios.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
