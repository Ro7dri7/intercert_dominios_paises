# Bloque para agregar al final de nginx/nginx.cloudflare.conf
# del proyecto intercert-latam (DENTRO del bloque http { ... }, antes del cierre })
#
# Requiere en docker-compose.production.yml:
#   - /var/www/intercert-landing:/var/www/intercert-landing:ro

    # =========================================================
    # LANDING DOMINIOS TLD — intercert.co, .mx, .ec, etc.
    # NO afecta intercertlatam.com ni portal.intercertlatam.com
    # =========================================================
    server {
        listen 80;
        listen 443 ssl http2;
        server_name
            intercert.co www.intercert.co
            intercert.mx www.intercert.mx
            intercert.ec www.intercert.ec
            intercert.pa www.intercert.pa
            intercert.com.pe www.intercert.com.pe
            intercert.cr www.intercert.cr
            intercert.es www.intercert.es;

        ssl_certificate /etc/nginx/ssl/self-signed/security-subdomains.crt;
        ssl_certificate_key /etc/nginx/ssl/self-signed/security-subdomains.key;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        access_log /var/log/nginx/intercert-dominios.access.log main;
        error_log  /var/log/nginx/intercert-dominios.error.log;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            root /var/www/intercert-landing;
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
            root /var/www/intercert-landing;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
